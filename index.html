<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Visitor Sign-In</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f5f6f8;

}

body {

  display: flex;

  justify-content: center;

  align-items: center;

}

.container {

  width: 100%;

  max-width: 650px;

  padding: 30px;

}

.card {

  background: white;

  border-radius: 18px;

  padding: 35px;

  box-shadow:
    0 8px 30px rgba(
      0,
      0,
      0,
      0.10
    );

}

.header {

  text-align: center;

  margin-bottom: 25px;

}

.header h1 {

  margin: 0;

  font-size: 32px;

}

.header p {

  margin: 8px 0 0;

  color: #666;

  font-size: 16px;

}

.language {

  display: flex;

  justify-content: center;

  gap: 10px;

  margin-bottom: 25px;

}

.language button {

  border: 1px solid #ccc;

  background: white;

  padding: 8px 16px;

  border-radius: 8px;

  cursor: pointer;

  font-size: 14px;

}

.language button.active {

  background: #222;

  color: white;

  border-color: #222;

}

.form-group {

  margin-bottom: 20px;

}

.form-group label {

  display: block;

  margin-bottom: 7px;

  font-weight: bold;

  font-size: 16px;

}

.form-group input {

  width: 100%;

  padding: 14px;

  border:

    1px solid #ccc;

  border-radius: 9px;

  font-size: 18px;

}

.camera-section {

  margin-top: 25px;

}

.camera-container {

  position: relative;

  width: 100%;

  background: #111;

  border-radius: 12px;

  overflow: hidden;

  aspect-ratio: 4 / 3;

}

#video {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: block;

}

#photoPreview {

  width: 100%;

  height: 100%;

  object-fit: cover;

  display: none;

}

.camera-buttons {

  display: flex;

  gap: 10px;

  margin-top: 12px;

}

.camera-buttons button {

  flex: 1;

}

button {

  border: none;

  border-radius: 9px;

  padding: 14px 18px;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

#captureButton {

  background: #333;

  color: white;

}

#retakeButton {

  background: #ddd;

  color: #222;

}

#submitButton {

  width: 100%;

  margin-top: 25px;

  background: #0b57d0;

  color: white;

  font-size: 19px;

  padding: 17px;

}

button:disabled {

  opacity: 0.5;

  cursor: not-allowed;

}

.status {

  margin-top: 20px;

  text-align: center;

  min-height: 25px;

  font-size: 16px;

}

.success {

  color: #188038;

}

.error {

  color: #d93025;

}

.loading {

  color: #555;

}

.hidden {

  display: none !important;

}

/*
 * Hidden form used to POST to Apps Script.
 *
 * This avoids the CORS problems that occurred
 * when using fetch() from GitHub Pages.
 */

#submitFrame {

  width: 1px;

  height: 1px;

  border: 0;

  position: absolute;

  left: -10000px;

  top: -10000px;

}

#submitForm {

  display: none;

}

</style>

</head>


<body>


<div class="container">

  <div class="card">

    <div class="header">

      <h1 id="pageTitle">
        Visitor Sign-In
      </h1>

      <p id="pageSubtitle">
        Please enter your information below.
      </p>

    </div>


    <div class="language">

      <button
        id="englishButton"
        class="active"
        type="button"
      >
        English
      </button>

      <button
        id="spanishButton"
        type="button"
      >
        Español
      </button>

    </div>


    <form id="visitorForm">

      <div class="form-group">

        <label
          id="firstNameLabel"
          for="firstName"
        >
          First Name
        </label>

        <input
          id="firstName"
          name="firstName"
          type="text"
          autocomplete="off"
          required
        >

      </div>


      <div class="form-group">

        <label
          id="lastNameLabel"
          for="lastName"
        >
          Last Name
        </label>

        <input
          id="lastName"
          name="lastName"
          type="text"
          autocomplete="off"
          required
        >

      </div>


      <div class="camera-section">

        <div class="camera-container">

          <video
            id="video"
            autoplay
            playsinline
            muted
          ></video>

          <img
            id="photoPreview"
            alt="Visitor photo"
          >

        </div>


        <canvas
          id="canvas"
          class="hidden"
        ></canvas>


        <div class="camera-buttons">

          <button
            id="captureButton"
            type="button"
          >
            Take Photo
          </button>

          <button
            id="retakeButton"
            type="button"
            class="hidden"
          >
            Retake Photo
          </button>

        </div>

      </div>


      <button
        id="submitButton"
        type="submit"
      >
        Sign In
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </form>

  </div>

</div>


<!--
  Hidden Apps Script submission iframe.
-->
<iframe
  name="submitFrame"
  id="submitFrame"
></iframe>


<!--
  Hidden form used to submit visitor information.
-->
<form
  id="submitForm"
  method="POST"
  target="submitFrame"
  action="https://script.google.com/macros/s/AKfycbwK8NN2n4WPj4yQrfqugJR9YYzv49TiCYqloDUgMppZ2PUduB0Se85ZI_U5FKeO5Pal/exec"
>

  <input
    type="hidden"
    name="firstName"
    id="submitFirstName"
  >

  <input
    type="hidden"
    name="lastName"
    id="submitLastName"
  >

  <input
    type="hidden"
    name="photoDataUrl"
    id="submitPhotoDataUrl"
  >

  <input
    type="hidden"
    name="device"
    id="submitDevice"
  >

  <input
    type="hidden"
    name="lang"
    id="submitLang"
  >

</form>


<script>


/* ============================================================
   CONFIGURATION
   ============================================================ */

const RESET_TIME = 120000;


/* ============================================================
   ELEMENTS
   ============================================================ */

const visitorForm =
  document.getElementById(
    "visitorForm"
  );

const firstName =
  document.getElementById(
    "firstName"
  );

const lastName =
  document.getElementById(
    "lastName"
  );

const video =
  document.getElementById(
    "video"
  );

const canvas =
  document.getElementById(
    "canvas"
  );

const photoPreview =
  document.getElementById(
    "photoPreview"
  );

const captureButton =
  document.getElementById(
    "captureButton"
  );

const retakeButton =
  document.getElementById(
    "retakeButton"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );

const status =
  document.getElementById(
    "status"
  );

const submitForm =
  document.getElementById(
    "submitForm"
  );

const submitFirstName =
  document.getElementById(
    "submitFirstName"
  );

const submitLastName =
  document.getElementById(
    "submitLastName"
  );

const submitPhotoDataUrl =
  document.getElementById(
    "submitPhotoDataUrl"
  );

const submitDevice =
  document.getElementById(
    "submitDevice"
  );

const submitLang =
  document.getElementById(
    "submitLang"
  );

const englishButton =
  document.getElementById(
    "englishButton"
  );

const spanishButton =
  document.getElementById(
    "spanishButton"
  );


/* ============================================================
   LANGUAGE
   ============================================================ */

let currentLanguage = "en";


const translations = {

  en: {

    title:
      "Visitor Sign-In",

    subtitle:
      "Please enter your information below.",

    firstName:
      "First Name",

    lastName:
      "Last Name",

    takePhoto:
      "Take Photo",

    retake:
      "Retake Photo",

    signIn:
      "Sign In",

    startingCamera:
      "Starting camera...",

    cameraReady:
      "Camera ready.",

    cameraError:
      "Unable to access the camera. Please check camera permissions.",

    photoTaken:
      "Photo captured.",

    processing:
      "Creating your visitor badge...",

    printing:
      "Printing visitor badge...",

    complete:
      "Done. Please check in with the secretary.",

    error:
      "Something went wrong. Please contact the secretary."

  },


  es: {

    title:
      "Registro de Visitantes",

    subtitle:
      "Ingrese su información a continuación.",

    firstName:
      "Nombre",

    lastName:
      "Apellido",

    takePhoto:
      "Tomar Foto",

    retake:
      "Tomar Otra Foto",

    signIn:
      "Registrarse",

    startingCamera:
      "Iniciando cámara...",

    cameraReady:
      "Cámara lista.",

    cameraError:
      "No se pudo acceder a la cámara. Revise los permisos de la cámara.",

    photoTaken:
      "Foto tomada.",

    processing:
      "Creando su gafete de visitante...",

    printing:
      "Imprimiendo gafete de visitante...",

    complete:
      "Listo. Por favor, regístrese con la secretaria.",

    error:
      "Algo salió mal. Por favor, comuníquese con la secretaria."

  }

};


function setLanguage(lang) {

  currentLanguage =
    lang === "es"
      ? "es"
      : "en";

  const t =
    translations[currentLanguage];


  document.documentElement.lang =
    currentLanguage;


  document.getElementById(
    "pageTitle"
  ).textContent = t.title;


  document.getElementById(
    "pageSubtitle"
  ).textContent = t.subtitle;


  document.getElementById(
    "firstNameLabel"
  ).textContent = t.firstName;


  document.getElementById(
    "lastNameLabel"
  ).textContent = t.lastName;


  captureButton.textContent =
    t.takePhoto;


  retakeButton.textContent =
    t.retake;


  submitButton.textContent =
    t.signIn;


  englishButton.classList.toggle(
    "active",
    currentLanguage === "en"
  );


  spanishButton.classList.toggle(
    "active",
    currentLanguage === "es"
  );

}


englishButton.addEventListener(
  "click",
  () => setLanguage("en")
);


spanishButton.addEventListener(
  "click",
  () => setLanguage("es")
);


/* ============================================================
   CAMERA
   ============================================================ */

let cameraStream = null;

let capturedPhotoDataUrl = "";


async function startCamera() {

  const t =
    translations[currentLanguage];

  status.textContent =
    t.startingCamera;

  status.className =
    "status loading";


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      cameraStream;


    await video.play();


    status.textContent =
      t.cameraReady;

    status.className =
      "status";


  } catch (error) {

    console.error(
      "Camera error:",
      error
    );

    status.textContent =
      t.cameraError;

    status.className =
      "status error";

  }

}


/* ============================================================
   CAPTURE PHOTO
   ============================================================ */

captureButton.addEventListener(
  "click",
  capturePhoto
);


function capturePhoto() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    status.textContent =
      "Camera is not ready.";

    status.className =
      "status error";

    return;
  }


  const maxWidth = 700;

  let width =
    video.videoWidth;

  let height =
    video.videoHeight;


  if (width > maxWidth) {

    height =
      Math.round(
        height *
        (maxWidth / width)
      );

    width =
      maxWidth;
  }


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext("2d");


  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  capturedPhotoDataUrl =
    canvas.toDataURL(
      "image/jpeg",
      0.72
    );


  photoPreview.src =
    capturedPhotoDataUrl;


  video.style.display =
    "none";

  photoPreview.style.display =
    "block";


  captureButton.classList.add(
    "hidden"
  );

  retakeButton.classList.remove(
    "hidden"
  );


  const t =
    translations[currentLanguage];


  status.textContent =
    t.photoTaken;

  status.className =
    "status";


  resetTimer();

}


/* ============================================================
   RETAKE PHOTO
   ============================================================ */

retakeButton.addEventListener(
  "click",
  () => {

    capturedPhotoDataUrl = "";

    photoPreview.src = "";

    photoPreview.style.display =
      "none";

    video.style.display =
      "block";

    captureButton.classList.remove(
      "hidden"
    );

    retakeButton.classList.add(
      "hidden"
    );

    const t =
      translations[currentLanguage];

    status.textContent =
      t.cameraReady;

    status.className =
      "status";

    resetTimer();

  }
);


/* ============================================================
   SUBMIT VISITOR
   ============================================================ */

visitorForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (!firstName.value.trim()) {

      firstName.focus();

      return;
    }


    if (!lastName.value.trim()) {

      lastName.focus();

      return;
    }


    if (!capturedPhotoDataUrl) {

      status.textContent =
        "Please take a photo first.";

      status.className =
        "status error";

      return;
    }


    const t =
      translations[currentLanguage];


    submitButton.disabled =
      true;

    captureButton.disabled =
      true;

    retakeButton.disabled =
      true;


    status.textContent =
      t.processing;

    status.className =
      "status loading";


    /*
     * Populate hidden Apps Script form.
     */

    submitFirstName.value =
      firstName.value.trim();


    submitLastName.value =
      lastName.value.trim();


    submitPhotoDataUrl.value =
      capturedPhotoDataUrl;


    submitLang.value =
      currentLanguage;


    /*
     * Record Chromebook information.
     */

    submitDevice.value =
      navigator.userAgent;


    /*
     * Submit to Apps Script.
     */

    submitForm.submit();

    resetTimer();

  }
);


/* ============================================================
   RECEIVE APPS SCRIPT RESPONSE
   ============================================================ */

window.addEventListener(
  "message",
  async function(event) {

    /*
     * Apps Script returns a JSON string
     * through window.parent.postMessage().
     */

    let response = null;


    try {

      if (
        typeof event.data === "string"
      ) {

        response =
          JSON.parse(event.data);

      } else if (
        event.data &&
        typeof event.data === "object"
      ) {

        response =
          event.data;

      }

    } catch (error) {

      console.error(
        "Could not parse Apps Script response:",
        error
      );

      return;

    }


    if (!response) {
      return;
    }


    if (!response.ok) {

      const t =
        translations[currentLanguage];


      status.textContent =
        response.error ||
        t.error;

      status.className =
        "status error";


      submitButton.disabled =
        false;

      captureButton.disabled =
        false;

      retakeButton.disabled =
        false;


      return;
    }


    /*
     * We have successfully:
     *
     * 1. Saved the photo
     * 2. Created the badge PDF
     * 3. Logged the visitor
     *
     * Now print the badge.
     */

    await printBadge(
      response.badgeHtml
    );

  }
);


/* ============================================================
   PRINT BADGE
   ============================================================ */

async function printBadge(
  badgeHtml
) {

  const t =
    translations[currentLanguage];


  status.textContent =
    t.printing;

  status.className =
    "status loading";


  if (!badgeHtml) {

    status.textContent =
      t.error;

    status.className =
      "status error";

    return;
  }


  /*
   * Create an invisible print iframe.
   *
   * This keeps the visitor kiosk page itself
   * visible while the badge is printed.
   */

  const printFrame =
    document.createElement(
      "iframe"
    );


  printFrame.style.position =
    "fixed";

  printFrame.style.right =
    "0";

  printFrame.style.bottom =
    "0";

  printFrame.style.width =
    "0";

  printFrame.style.height =
    "0";

  printFrame.style.border =
    "0";

  printFrame.style.opacity =
    "0";


  document.body.appendChild(
    printFrame
  );


  /*
   * Wait for the iframe document to become available.
   */

  const printDocument =
    printFrame.contentWindow.document;


  printDocument.open();

  printDocument.write(
    badgeHtml
  );

  printDocument.close();


  /*
   * Wait for the badge image to load.
   *
   * The image is a data URL, but we still
   * give Chrome a moment to finish layout.
   */

  await new Promise(
    resolve => setTimeout(
      resolve,
      500
    )
  );


  /*
   * Print.
   *
   * With ChromeOS SilentPrintingEnabled enabled,
   * Chrome should immediately send this to the
   * default printer instead of displaying
   * print preview.
   */

  try {

    printFrame.contentWindow.focus();

    printFrame.contentWindow.print();

  } catch (error) {

    console.error(
      "Print error:",
      error
    );

    status.textContent =
      t.error;

    status.className =
      "status error";


    document.body.removeChild(
      printFrame
    );

    submitButton.disabled =
      false;

    captureButton.disabled =
      false;

    retakeButton.disabled =
      false;

    return;
  }


  /*
   * Give Chrome time to hand the job
   * to the printing system.
   */

  setTimeout(
    () => {

      try {

        document.body.removeChild(
          printFrame
        );

      } catch (error) {

        console.log(
          "Print iframe cleanup:",
          error
        );

      }

    },
    3000
  );


  /*
   * Tell visitor the process is complete.
   */

  status.textContent =
    t.complete;

  status.className =
    "status success";


  /*
   * Reset kiosk after a short delay.
   */

  setTimeout(
    resetKiosk,
    2500
  );

}


/* ============================================================
   RESET KIOSK
   ============================================================ */

function resetKiosk() {

  visitorForm.reset();

  capturedPhotoDataUrl =
    "";


  photoPreview.src = "";

  photoPreview.style.display =
    "none";


  video.style.display =
    "block";


  captureButton.classList.remove(
    "hidden"
  );


  retakeButton.classList.add(
    "hidden"
  );


  submitButton.disabled =
    false;

  captureButton.disabled =
    false;

  retakeButton.disabled =
    false;


  status.textContent =
    "";


  startCamera();

  resetTimer();

}


/* ============================================================
   INACTIVITY RESET
   ============================================================ */

let resetTimerHandle = null;


function resetTimer() {

  clearTimeout(
    resetTimerHandle
  );


  resetTimerHandle =
    setTimeout(
      () => {

        /*
         * Only reset if the form has
         * actually been abandoned.
         */

        if (
          !firstName.value &&
          !lastName.value &&
          !capturedPhotoDataUrl
        ) {

          return;

        }


        resetKiosk();

      },
      RESET_TIME
    );

}


/* ============================================================
   USER ACTIVITY
   ============================================================ */

[
  "click",
  "touchstart",
  "keydown",
  "input"
].forEach(
  eventName => {

    document.addEventListener(
      eventName,
      resetTimer,
      {
        passive: true
      }
    );

  }
);


/* ============================================================
   INITIALIZE
   ============================================================ */

setLanguage("en");

startCamera();

resetTimer();


</script>

</body>

</html>
