<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Sign-In</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#edf1f6;color:#1e293b}
body{min-height:100dvh;display:grid;place-items:center;padding:12px}
.container{width:min(100%,1120px)}
.card{background:#fff;border-radius:18px;padding:22px 28px;box-shadow:0 8px 30px #1725541b}
.header{text-align:center;margin-bottom:10px}.header h1{font-size:28px;margin:0}.header p{font-size:14px;color:#64748b;margin:5px 0}
.language{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
button{border:0;border-radius:9px;padding:12px 15px;font-size:16px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:not-allowed}
.language button{background:#fff;color:#1e293b;border:1px solid #cbd5e1;padding:8px 17px;font-size:14px}
.language button.active{background:#1e293b;color:white}
.form-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:24px;align-items:start}
.form-group{margin-bottom:18px}.form-group label{display:block;margin-bottom:7px;font-weight:700;font-size:17px}
.form-group input{width:100%;height:56px;padding:11px 14px;border:1px solid #cbd5e1;border-radius:9px;font-size:20px}
.camera-container{width:100%;height:330px;background:#111;border-radius:12px;overflow:hidden}
#video,#photoPreview{width:100%;height:100%;object-fit:cover;display:block}#photoPreview{display:none}
.camera-buttons{display:flex;gap:10px;margin-top:10px}.camera-buttons button{flex:1}
#captureButton{background:#334155;color:white}#retakeButton{background:#e2e8f0;color:#1e293b}
#submitButton{width:100%;background:#0b57d0;color:white;font-size:21px;padding:17px;margin-top:10px}
.status{text-align:center;margin-top:11px;min-height:35px;font-size:15px}.error{color:#b91c1c}.success{color:#15803d}.loading{color:#475569}
.hidden{display:none!important}#submitFrame{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;border:none}#submitForm{display:none}
.info{color:#64748b;font-size:13px;line-height:1.5;margin:12px 0 0}
.print-tools{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.print-tools button{background:#e2e8f0;color:#1e293b;font-size:13px;padding:9px 12px}
@media(max-width:750px){body{display:block;padding:10px}.card{padding:17px}.form-layout{grid-template-columns:1fr;gap:5px}.camera-container{height:min(35vh,280px)}.header h1{font-size:24px}}
@media(min-width:751px) and (max-height:660px){body{padding:5px}.card{padding:12px 22px}.header{margin-bottom:3px}.header h1{font-size:24px}.language{margin-bottom:6px}.camera-container{height:260px}.form-group{margin-bottom:10px}.form-group input{height:45px}#submitButton{padding:11px}}
</style>
</head>
<body>
<div class="container"><div class="card">
  <div class="header"><h1 id="pageTitle">Visitor Sign-In</h1><p id="pageSubtitle">Please enter your information below.</p></div>
  <div class="language"><button id="englishButton" class="active" type="button">English</button><button id="spanishButton" type="button">Español</button></div>
  <form id="visitorForm">
    <div class="form-layout">
      <div class="visitor-details">
        <div class="form-group"><label id="firstNameLabel" for="firstName">First Name</label><input id="firstName" autocomplete="off" maxlength="80" required></div>
        <div class="form-group"><label id="lastNameLabel" for="lastName">Last Name</label><input id="lastName" autocomplete="off" maxlength="80" required></div>
        <p class="info" id="cameraHint">Take a photo using the camera to the right, then select Sign In.</p>
        <button id="submitButton" type="submit">Sign In</button>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </div>
      <div class="camera-side">
        <div class="camera-container"><video id="video" autoplay playsinline muted></video><img id="photoPreview" alt="Visitor photo"><canvas id="canvas" class="hidden"></canvas></div>
        <div class="camera-buttons"><button id="captureButton" type="button">Take Photo</button><button id="retakeButton" type="button" class="hidden">Retake Photo</button></div>
      </div>
    </div>
  </form>
  <div class="print-tools">
    <button id="testPrintButton" type="button">Test Printer (No Check-In)</button>
    <button id="reprintButton" type="button" class="hidden">Open Last Badge / Reprint</button>
  </div>
</div></div>

<!-- Keep the same deployed Apps Script URL as your original file. -->
<iframe id="submitFrame" name="submitFrame" title="Submission response"></iframe>
<form id="submitForm" target="submitFrame" method="POST"
  action="https://script.google.com/macros/s/AKfycbwK8NN2n4WPj4yQrfqugJR9YYzv49TiCYqloDUgMppZ2PUduB0Se85ZI_U5FKeO5Pal/exec">
  <input type="hidden" name="firstName" id="submitFirstName">
  <input type="hidden" name="lastName" id="submitLastName">
  <input type="hidden" name="photoDataUrl" id="submitPhotoDataUrl">
  <input type="hidden" name="device" id="submitDevice">
  <input type="hidden" name="lang" id="submitLang">
  <input type="hidden" name="requestId" id="submitRequestId">
</form>

<script>
'use strict';
const RESET_TIME_MS = 120000;
const SUBMISSION_TIMEOUT_MS = 45000;
const $ = id => document.getElementById(id);
const visitorForm = $('visitorForm');
const firstName = $('firstName');
const lastName = $('lastName');
const video = $('video');
const canvas = $('canvas');
const preview = $('photoPreview');
const captureButton = $('captureButton');
const retakeButton = $('retakeButton');
const submitButton = $('submitButton');
const statusBox = $('status');
const submitForm = $('submitForm');
const submitFrame = $('submitFrame');
const translations = {
  en: {
    title:'Visitor Sign-In', subtitle:'Please enter your information below.',
    first:'First Name', last:'Last Name', capture:'Take Photo', retake:'Retake Photo', sign:'Sign In',
    starting:'Starting camera...', ready:'Camera ready.', cameraError:'Unable to access the camera. Please check camera permissions.',
    captured:'Photo captured.', needPhoto:'Please take a photo first.',
    processing:'Creating your visitor badge...', printing:'Sending badge to the printer...',
    complete:'Check-in saved. Your badge has been sent to the printer. Please check in with the secretary.',
    error:'Something went wrong. Please contact the secretary.',
    hint:'Take a photo using the camera to the right, then select Sign In.',
    timeout:'The request timed out. Please ask the secretary to check whether your visit was recorded before trying again.'
  },
  es: {
    title:'Registro de Visitantes', subtitle:'Ingrese su información a continuación.',
    first:'Nombre', last:'Apellido', capture:'Tomar Foto', retake:'Tomar Otra Foto', sign:'Registrarse',
    starting:'Iniciando cámara...', ready:'Cámara lista.', cameraError:'No se pudo acceder a la cámara. Revise los permisos.',
    captured:'Foto tomada.', needPhoto:'Primero tome una foto.',
    processing:'Creando su gafete de visitante...', printing:'Enviando el gafete a la impresora...',
    complete:'Registro guardado. Se envió el gafete a la impresora. Consulte con la secretaria.',
    error:'Ocurrió un error. Comuníquese con la secretaria.',
    hint:'Tome una foto con la cámara a la derecha y después seleccione Registrarse.',
    timeout:'La solicitud tardó demasiado. Consulte con la secretaria antes de intentar de nuevo.'
  }
};
let lang = 'en';
let stream = null;
let photoDataUrl = '';
let printPhotoDataUrl = ''; // separate bright, dithered photo for thermal labels
let submitting = false;
let resetHandle = null;
let requestTimeoutHandle = null;
let completionHandle = null;
let printWindow = null;
let activeRequestId = null;
let lastBadgeHtml = '';
let printSucceeded = false;
let recordSaved = false;
const PRINT_WINDOW_NAME = 'visitor_badge_print';

function t() { return translations[lang]; }
function show(message, kind='') { statusBox.textContent = message; statusBox.className = 'status ' + kind; }
function setLanguage(value) {
  if (submitting) return;
  lang = value === 'es' ? 'es' : 'en';
  document.documentElement.lang = lang;
  const x = t();
  $('pageTitle').textContent=x.title; $('pageSubtitle').textContent=x.subtitle;
  $('firstNameLabel').textContent=x.first; $('lastNameLabel').textContent=x.last; $('cameraHint').textContent=x.hint;
  captureButton.textContent=x.capture; retakeButton.textContent=x.retake; submitButton.textContent=x.sign;
  $('englishButton').classList.toggle('active',lang==='en');
  $('spanishButton').classList.toggle('active',lang==='es');
}
$('englishButton').addEventListener('click',()=>setLanguage('en'));
$('spanishButton').addEventListener('click',()=>setLanguage('es'));

async function startCamera() {
  if (stream && stream.getVideoTracks().some(track=>track.readyState==='live')) {
    video.srcObject=stream;
    try { await video.play(); } catch (_) {}
    return;
  }
  show(t().starting,'loading');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
    video.srcObject=stream;
    await video.play();
    show(t().ready);
  } catch (err) {
    console.error('Camera:',err);
    show(t().cameraError,'error');
  }
}
// Turn a camera frame into a high-key black/white image specifically for the
// Brother direct-thermal printer. The original color JPEG remains unchanged
// for Google Drive and the kiosk preview.
function makeThermalPhoto(sourceCanvas) {
  const size=288;
  const output=document.createElement('canvas');
  output.width=size; output.height=size;
  const ctx=output.getContext('2d', {willReadFrequently:true});
  // Center crop, same square shape as the badge photo.
  const crop=Math.min(sourceCanvas.width,sourceCanvas.height);
  const sx=(sourceCanvas.width-crop)/2;
  const sy=(sourceCanvas.height-crop)/2;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  ctx.drawImage(sourceCanvas,sx,sy,crop,crop,0,0,size,size);
  const img=ctx.getImageData(0,0,size,size);
  const px=img.data;
  const matrix=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
  // Brighten shadows strongly then use ordered dithering rather than allowing
  // the printer to convert gray patches into nearly solid black.
  for(let y=0;y<size;y++) for(let x=0;x<size;x++) {
    const i=(y*size+x)*4;
    const lum=(0.2126*px[i]+0.7152*px[i+1]+0.0722*px[i+2])/255;
    const lifted=Math.min(1,Math.pow(lum,0.56)*1.12+0.08);
    const threshold=(matrix[(y%4)*4+(x%4)]+0.5)/16;
    const value=lifted>threshold?255:0;
    px[i]=value; px[i+1]=value; px[i+2]=value; px[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  return output.toDataURL('image/png');
}

function capturePhoto() {
  if (submitting) return;
  if (!video.videoWidth || !video.videoHeight) { show(t().cameraError,'error'); return; }
  const width=Math.min(700,video.videoWidth);
  const height=Math.round(video.videoHeight * width / video.videoWidth);
  canvas.width=width; canvas.height=height;
  canvas.getContext('2d').drawImage(video,0,0,width,height);
  photoDataUrl=canvas.toDataURL('image/jpeg',.72);
  printPhotoDataUrl=makeThermalPhoto(canvas);
  preview.src=photoDataUrl;
  preview.style.display='block'; video.style.display='none';
  captureButton.classList.add('hidden'); retakeButton.classList.remove('hidden');
  show(t().captured); resetInactivityTimer();
}
function retakePhoto() {
  if (submitting) return;
  photoDataUrl=''; printPhotoDataUrl=''; preview.removeAttribute('src');
  preview.style.display='none'; video.style.display='block';
  captureButton.classList.remove('hidden'); retakeButton.classList.add('hidden');
  show(t().ready); resetInactivityTimer();
}
captureButton.addEventListener('click',capturePhoto);
retakeButton.addEventListener('click',retakePhoto);

function lockForm(locked) {
  submitButton.disabled=locked; captureButton.disabled=locked; retakeButton.disabled=locked;
  firstName.disabled=locked; lastName.disabled=locked;
  $('englishButton').disabled=locked; $('spanishButton').disabled=locked;
}
visitorForm.addEventListener('submit', event=>{
  event.preventDefault();
  if (submitting) return;
  if (!firstName.value.trim()) { firstName.focus(); return; }
  if (!lastName.value.trim()) { lastName.focus(); return; }
  if (!photoDataUrl) { show(t().needPhoto,'error'); return; }
  // Generate the badge directly on this Chromebook. Printing no longer waits
  // for the Google Apps Script response, which may be delayed or blocked.
  printWindow = openPrintWindow();
  const localBadge = buildLocalBadge(firstName.value.trim(),lastName.value.trim(),printPhotoDataUrl || photoDataUrl,lang);
  lastBadgeHtml = localBadge;
  $('reprintButton').classList.remove('hidden');
  printSucceeded = false;
  recordSaved = false;
  void printBadge(localBadge,printWindow).then(()=>{
    printSucceeded = true;
    if (!recordSaved) show(submitting ? 'Print command sent. Saving visitor record…' :
      'Print command sent. Check the printer queue.','loading');
  }).catch(err=>{
    console.error('Local badge print:',err);
    show('Print was not started: '+err.message+'. Use Open Last Badge / Reprint.','error');
  });
  activeRequestId = (typeof crypto !== 'undefined' && crypto.randomUUID)
    ? crypto.randomUUID() : String(Date.now()) + '-' + Math.random().toString(36).slice(2);
  $('submitRequestId').value=activeRequestId;
  submitting=true; clearTimeout(resetHandle); clearTimeout(completionHandle);
  lockForm(true); show('Printing badge and saving visitor…','loading');
  $('submitFirstName').value=firstName.value.trim();
  $('submitLastName').value=lastName.value.trim();
  $('submitPhotoDataUrl').value=photoDataUrl;
  $('submitDevice').value=navigator.userAgent;
  $('submitLang').value=lang;
  requestTimeoutHandle=setTimeout(()=>{
    // Do not automatically resubmit: the backend may already have saved the visitor.
    submitting=false; activeRequestId=null; lockForm(false);
    show('Badge printing was requested, but record-saving confirmation was not received. Check Google Sheets before retrying.','error'); resetInactivityTimer();
  },SUBMISSION_TIMEOUT_MS);
  submitForm.submit();
});

window.addEventListener('message',async event=>{
  // Apps Script can embed its response within additional Google-owned iframes.
  // Do NOT require event.source === submitFrame.contentWindow; that can discard
  // legitimate responses. Match the unpredictable request ID instead.
  if (!submitting) return;
  if (event.origin !== 'null' &&
      !/^https:\/\/(?:[a-z0-9-]+\.)*(?:googleusercontent\.com|google\.com)$/.test(event.origin)) return;
  let response;
  try { response=typeof event.data==='string'?JSON.parse(event.data):event.data; } catch (_) { return; }
  if (!response || response.type!=='visitor-kiosk-result' ||
      response.requestId !== activeRequestId || typeof response.ok!=='boolean') return;
  clearTimeout(requestTimeoutHandle);
  if (!response.ok) {
    submitting=false; activeRequestId=null; lockForm(false); show('Visitor record could not be confirmed: '+(response.error||t().error),'error'); resetInactivityTimer(); return;
  }
  // The browser already generated and printed this exact check-in badge.
  // Never print again on receipt; this avoids duplicate labels.
  recordSaved = true;
  submitting = false;
  activeRequestId = null;
  lockForm(false);
  show('Visitor record saved. Badge print was requested; check the printer queue.','success');
  completionHandle=setTimeout(resetKiosk,8000);
});

function escapeText(value) {
  return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function buildLocalBadge(first,last,photo,language) {
  const fullName = (first+' '+last).trim();
  const smallName = fullName.length > 27;
  const visitor = language==='es'?'VISITANTE':'VISITOR';
  const prefix = language==='es'?'Entrada:':'Check-in:';
  const stamp = new Intl.DateTimeFormat(language==='es'?'es-US':'en-US',{
    month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'
  }).format(new Date());
  return `<!doctype html><html><head><meta charset="utf-8"><title>Visitor Badge</title>
<style>
@page{size:90.3mm 29mm;margin:0}
*{box-sizing:border-box}
html,body{width:90.3mm;height:29mm;margin:0;padding:0;overflow:hidden;background:white}
body{font-family:Arial,Helvetica,sans-serif;color:black;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.badge{display:flex;align-items:center;width:100%;height:100%;padding:1.6mm 2mm;gap:2.7mm}
.photo{display:block;width:25.4mm;height:25.4mm;object-fit:cover;flex:0 0 25.4mm;border:.2mm solid #444}
.details{min-width:0;flex:1;overflow:hidden}
.kind{font-size:10pt;font-weight:900;letter-spacing:.5mm;line-height:1.1;margin-bottom:1.2mm}
.name{font-size:${smallName?'12':'15'}pt;font-weight:800;line-height:1.04;overflow-wrap:anywhere;max-height:13mm;overflow:hidden}
.time{font-size:7.5pt;margin-top:1.3mm;line-height:1.12;white-space:nowrap}
</style></head><body><div class="badge"><img class="photo" src="${photo}" alt="">
<div class="details"><div class="kind">${visitor}</div><div class="name">${escapeText(fullName)}</div>
<div class="time">${prefix} ${escapeText(stamp)}</div></div></div></body></html>`;
}

function openPrintWindow() {
  // MUST run directly from a user click/submit; asynchronous opening is often blocked.
  const w = window.open('', PRINT_WINDOW_NAME, 'popup=yes,width=850,height=500');
  if (!w) { console.warn('Popup blocked by ChromeOS policy'); return null; }
  try {
    w.document.open();
    w.document.write('<!doctype html><html><head><title>Visitor label — preparing</title></head><body style="font:20px Arial;padding:30px">Preparing label…</body></html>');
    w.document.close();
  } catch (e) { console.warn(e); }
  return w;
}

async function printBadge(html, win) {
  if (typeof html !== 'string' || !html.includes('class="badge"') && !html.includes('PRINT TEST'))
    throw new Error('Badge HTML missing');
  if (!win || win.closed) {
    show('The print window was blocked. Allow pop-ups for this site or use Open Last Badge / Reprint.','error');
    throw new Error('Print window blocked');
  }
  show(t().printing,'loading');
  win.document.open(); win.document.write(html); win.document.close();
  // Explicitly wait for the embedded visitor photo and fonts.
  await Promise.race([
    Promise.all(Array.from(win.document.images).map(img => img.decode ? img.decode().catch(()=>{}) : Promise.resolve())),
    new Promise(resolve=>setTimeout(resolve,5000))
  ]);
  if (win.document.fonts && win.document.fonts.ready) await win.document.fonts.ready;
  await new Promise(resolve=>setTimeout(resolve,250));
  if (win.closed) throw new Error('Print window closed');
  win.focus();
  win.print();
  // Window deliberately stays open for debugging; do not claim actual paper printed.
}

$('reprintButton').addEventListener('click',async()=>{
  if (!lastBadgeHtml) return;
  const w=openPrintWindow();
  try { await printBadge(lastBadgeHtml,w); show('Print request opened. Check the printer queue.','success'); }
  catch (e) { console.error(e); show('Printer window blocked or failed: '+e.message,'error'); }
});

$('testPrintButton').addEventListener('click',async()=>{
  const w=openPrintWindow();
  const testHtml=`<!doctype html><html><head><meta charset="utf-8"><title>Print test</title>
  <style>@page{size:90.3mm 29mm;margin:0}*{box-sizing:border-box}html,body{width:90.3mm;height:29mm;margin:0;overflow:hidden;font-family:Arial}
  .badge{width:90.3mm;height:29mm;padding:3mm 4mm}.label{font-size:16pt;font-weight:900}.small{font-size:10pt;margin-top:2mm}</style></head>
  <body><div class="badge"><div class="label">VISITOR PRINT TEST</div><div class="small">DK-1201 · 90.3 × 29 mm</div></div></body></html>`;
  try { await printBadge(testHtml,w); show('Print test requested. Check queue / printer.','success'); }
  catch(e) { console.error(e); show('Print test failed: '+e.message,'error'); }
});

function resetKiosk() {
  if (submitting && !completionHandle) return;
  submitting=false; activeRequestId=null; clearTimeout(requestTimeoutHandle); clearTimeout(completionHandle);
  lastBadgeHtml=''; printSucceeded=false; recordSaved=false; $('reprintButton').classList.add('hidden');
  visitorForm.reset(); photoDataUrl=''; printPhotoDataUrl=''; preview.removeAttribute('src');
  preview.style.display='none'; video.style.display='block';
  captureButton.classList.remove('hidden'); retakeButton.classList.add('hidden');
  lockForm(false); setLanguage('en'); show(''); startCamera(); resetInactivityTimer();
}
function resetInactivityTimer() {
  if (submitting) return;
  clearTimeout(resetHandle);
  resetHandle=setTimeout(()=>{
    if (firstName.value || lastName.value || photoDataUrl || lang!=='en') resetKiosk();
  },RESET_TIME_MS);
}
['click','touchstart','keydown','input'].forEach(name=>
  document.addEventListener(name,resetInactivityTimer,{passive:true}));
setLanguage('en');
startCamera();
resetInactivityTimer();

</script>
</body>
</html>
