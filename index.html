<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visitor Sign-In</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f5f6f8; }
  body { display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; }
  .container { width: 100%; max-width: 650px; }
  .card { background: white; border-radius: 18px; padding: 30px; box-shadow: 0 8px 30px #00000018; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 32px; margin: 0; }
  .header p { color: #666; font-size: 16px; margin: 8px 0 0; }
  .language { display: flex; justify-content: center; gap: 10px; margin-bottom: 24px; }
  button { border: 0; border-radius: 9px; padding: 14px 18px; font-size: 17px; font-weight: bold; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .language button { border: 1px solid #ccc; background: white; padding: 8px 16px; font-size: 14px; }
  .language button.active { background: #222; color: white; border-color: #222; }
  .form-group { margin-bottom: 18px; }
  .form-group label { display: block; margin-bottom: 7px; font-weight: bold; font-size: 16px; }
  .form-group input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 9px; font-size: 18px; }
  .camera-container { width: 100%; position: relative; aspect-ratio: 4/3; background: #111; border-radius: 12px; overflow: hidden; }
  #video, #photoPreview { width: 100%; height: 100%; object-fit: cover; }
  #photoPreview { display: none; }
  .camera-buttons { display: flex; gap: 10px; margin-top: 12px; }
  .camera-buttons button { flex: 1; }
  #captureButton { background: #333; color: white; }
  #retakeButton { background: #ddd; color: #222; }
  #submitButton { width: 100%; margin-top: 25px; color: white; background: #0b57d0; padding: 17px; font-size: 19px; }
  .status { text-align: center; margin-top: 20px; min-height: 25px; font-size: 16px; }
  .error { color: #d93025; }
  .success { color: #188038; }
  .loading { color: #555; }
  .hidden { display: none !important; }
  #submitFrame, #printFrame { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; border: none; }
  #submitForm { display: none; }
  @media (max-width: 500px) { .card { padding: 20px; } }
</style>
</head>
<body>
<div class="container"><div class="card">
  <div class="header"><h1 id="pageTitle">Visitor Sign-In</h1><p id="pageSubtitle">Please enter your information below.</p></div>
  <div class="language">
    <button id="englishButton" type="button" class="active">English</button>
    <button id="spanishButton" type="button">Español</button>
  </div>
  <form id="visitorForm">
    <div class="form-group"><label id="firstNameLabel" for="firstName">First Name</label><input id="firstName" type="text" autocomplete="off" maxlength="80" required></div>
    <div class="form-group"><label id="lastNameLabel" for="lastName">Last Name</label><input id="lastName" type="text" autocomplete="off" maxlength="80" required></div>
    <div class="camera-container">
      <video id="video" autoplay playsinline muted></video>
      <img id="photoPreview" alt="Visitor photo">
      <canvas id="canvas" class="hidden"></canvas>
    </div>
    <div class="camera-buttons">
      <button id="captureButton" type="button">Take Photo</button>
      <button id="retakeButton" type="button" class="hidden">Retake Photo</button>
    </div>
    <button id="submitButton" type="submit">Sign In</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </form>
</div></div>

<!-- Keep the same deployed Apps Script URL as your original file. -->
<iframe id="submitFrame" name="submitFrame" title="Submission response"></iframe>
<form id="submitForm" target="submitFrame" method="POST"
  action="https://script.google.com/macros/s/AKfycbwK8NN2n4WPj4yQrfqugJR9YYzv49TiCYqloDUgMppZ2PUduB0Se85ZI_U5FKeO5Pal/exec">
  <input type="hidden" name="firstName" id="submitFirstName">
  <input type="hidden" name="lastName" id="submitLastName">
  <input type="hidden" name="photoDataUrl" id="submitPhotoDataUrl">
  <input type="hidden" name="device" id="submitDevice">
  <input type="hidden" name="lang" id="submitLang">
</form>

<script>
'use strict';
const RESET_TIME_MS = 120000;
const SUBMISSION_TIMEOUT_MS = 45000;
const $ = id => document.getElementById(id);
const visitorForm = $('visitorForm');
const firstName = $('firstName');
const lastName = $('lastName');
const video = $('video');
const canvas = $('canvas');
const preview = $('photoPreview');
const captureButton = $('captureButton');
const retakeButton = $('retakeButton');
const submitButton = $('submitButton');
const statusBox = $('status');
const submitForm = $('submitForm');
const submitFrame = $('submitFrame');
const translations = {
  en: {
    title:'Visitor Sign-In', subtitle:'Please enter your information below.',
    first:'First Name', last:'Last Name', capture:'Take Photo', retake:'Retake Photo', sign:'Sign In',
    starting:'Starting camera...', ready:'Camera ready.', cameraError:'Unable to access the camera. Please check camera permissions.',
    captured:'Photo captured.', needPhoto:'Please take a photo first.',
    processing:'Creating your visitor badge...', printing:'Sending badge to the printer...',
    complete:'Check-in saved. Your badge has been sent to the printer. Please check in with the secretary.',
    error:'Something went wrong. Please contact the secretary.',
    timeout:'The request timed out. Please ask the secretary to check whether your visit was recorded before trying again.'
  },
  es: {
    title:'Registro de Visitantes', subtitle:'Ingrese su información a continuación.',
    first:'Nombre', last:'Apellido', capture:'Tomar Foto', retake:'Tomar Otra Foto', sign:'Registrarse',
    starting:'Iniciando cámara...', ready:'Cámara lista.', cameraError:'No se pudo acceder a la cámara. Revise los permisos.',
    captured:'Foto tomada.', needPhoto:'Primero tome una foto.',
    processing:'Creando su gafete de visitante...', printing:'Enviando el gafete a la impresora...',
    complete:'Registro guardado. Se envió el gafete a la impresora. Consulte con la secretaria.',
    error:'Ocurrió un error. Comuníquese con la secretaria.',
    timeout:'La solicitud tardó demasiado. Consulte con la secretaria antes de intentar de nuevo.'
  }
};
let lang = 'en';
let stream = null;
let photoDataUrl = '';
let submitting = false;
let resetHandle = null;
let requestTimeoutHandle = null;
let completionHandle = null;

function t() { return translations[lang]; }
function show(message, kind='') { statusBox.textContent = message; statusBox.className = 'status ' + kind; }
function setLanguage(value) {
  if (submitting) return;
  lang = value === 'es' ? 'es' : 'en';
  document.documentElement.lang = lang;
  const x = t();
  $('pageTitle').textContent=x.title; $('pageSubtitle').textContent=x.subtitle;
  $('firstNameLabel').textContent=x.first; $('lastNameLabel').textContent=x.last;
  captureButton.textContent=x.capture; retakeButton.textContent=x.retake; submitButton.textContent=x.sign;
  $('englishButton').classList.toggle('active',lang==='en');
  $('spanishButton').classList.toggle('active',lang==='es');
}
$('englishButton').addEventListener('click',()=>setLanguage('en'));
$('spanishButton').addEventListener('click',()=>setLanguage('es'));

async function startCamera() {
  if (stream && stream.getVideoTracks().some(track=>track.readyState==='live')) {
    video.srcObject=stream;
    try { await video.play(); } catch (_) {}
    return;
  }
  show(t().starting,'loading');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:720} }, audio:false
    });
    video.srcObject=stream;
    await video.play();
    show(t().ready);
  } catch (err) {
    console.error('Camera:',err);
    show(t().cameraError,'error');
  }
}
function capturePhoto() {
  if (submitting) return;
  if (!video.videoWidth || !video.videoHeight) { show(t().cameraError,'error'); return; }
  const width=Math.min(700,video.videoWidth);
  const height=Math.round(video.videoHeight * width / video.videoWidth);
  canvas.width=width; canvas.height=height;
  canvas.getContext('2d').drawImage(video,0,0,width,height);
  photoDataUrl=canvas.toDataURL('image/jpeg',.72);
  preview.src=photoDataUrl;
  preview.style.display='block'; video.style.display='none';
  captureButton.classList.add('hidden'); retakeButton.classList.remove('hidden');
  show(t().captured); resetInactivityTimer();
}
function retakePhoto() {
  if (submitting) return;
  photoDataUrl=''; preview.removeAttribute('src');
  preview.style.display='none'; video.style.display='block';
  captureButton.classList.remove('hidden'); retakeButton.classList.add('hidden');
  show(t().ready); resetInactivityTimer();
}
captureButton.addEventListener('click',capturePhoto);
retakeButton.addEventListener('click',retakePhoto);

function lockForm(locked) {
  submitButton.disabled=locked; captureButton.disabled=locked; retakeButton.disabled=locked;
  firstName.disabled=locked; lastName.disabled=locked;
  $('englishButton').disabled=locked; $('spanishButton').disabled=locked;
}
visitorForm.addEventListener('submit', event=>{
  event.preventDefault();
  if (submitting) return;
  if (!firstName.value.trim()) { firstName.focus(); return; }
  if (!lastName.value.trim()) { lastName.focus(); return; }
  if (!photoDataUrl) { show(t().needPhoto,'error'); return; }
  submitting=true; clearTimeout(resetHandle); clearTimeout(completionHandle);
  lockForm(true); show(t().processing,'loading');
  $('submitFirstName').value=firstName.value.trim();
  $('submitLastName').value=lastName.value.trim();
  $('submitPhotoDataUrl').value=photoDataUrl;
  $('submitDevice').value=navigator.userAgent;
  $('submitLang').value=lang;
  requestTimeoutHandle=setTimeout(()=>{
    // Do not automatically resubmit: the backend may already have saved the visitor.
    submitting=false; lockForm(false); show(t().timeout,'error'); resetInactivityTimer();
  },SUBMISSION_TIMEOUT_MS);
  submitForm.submit();
});

window.addEventListener('message',async event=>{
  // A reply must come from the specific iframe used to submit this form.
  if (event.source !== submitFrame.contentWindow || !submitting) return;
  // Apps Script may serve HTML through googleusercontent.com after redirects.
  if (!/^https:\/\/(?:[a-z0-9-]+\.)*(?:googleusercontent\.com|google\.com)$/.test(event.origin)) return;
  let response;
  try { response=typeof event.data==='string'?JSON.parse(event.data):event.data; } catch (_) { return; }
  if (!response || response.type!=='visitor-kiosk-result' || typeof response.ok!=='boolean') return;
  clearTimeout(requestTimeoutHandle);
  if (!response.ok) {
    submitting=false; lockForm(false); show(response.error||t().error,'error'); resetInactivityTimer(); return;
  }
  try {
    await printBadge(response.badgeHtml);
    show(t().complete,'success');
    completionHandle=setTimeout(resetKiosk,4500);
  } catch (err) {
    console.error('Print failed:',err);
    show(t().error + ' Your check-in may already be saved.','error');
    submitting=false; lockForm(false); resetInactivityTimer();
  }
});

async function printBadge(html) {
  if (typeof html!=='string' || !html.includes('class="badge"')) throw new Error('Badge HTML missing');
  show(t().printing,'loading');
  const frame=document.createElement('iframe');
  frame.id='printFrame'; frame.title='Visitor badge to print';
  document.body.appendChild(frame);
  try {
    const doc=frame.contentDocument;
    doc.open(); doc.write(html); doc.close();
    await Promise.race([
      Promise.all(Array.from(doc.images).map(img=>img.decode?img.decode().catch(()=>{}):Promise.resolve())),
      new Promise(resolve=>setTimeout(resolve,1800))
    ]);
    if (doc.fonts && doc.fonts.ready) await doc.fonts.ready;
    await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
    frame.contentWindow.focus();
    frame.contentWindow.print();
    // ChromeOS doesn't expose a reliable print-success event to webpages.
    await new Promise(resolve=>setTimeout(resolve,3000));
  } finally {
    frame.remove();
  }
}

function resetKiosk() {
  if (submitting && !completionHandle) return;
  submitting=false; clearTimeout(requestTimeoutHandle); clearTimeout(completionHandle);
  visitorForm.reset(); photoDataUrl=''; preview.removeAttribute('src');
  preview.style.display='none'; video.style.display='block';
  captureButton.classList.remove('hidden'); retakeButton.classList.add('hidden');
  lockForm(false); setLanguage('en'); show(''); startCamera(); resetInactivityTimer();
}
function resetInactivityTimer() {
  if (submitting) return;
  clearTimeout(resetHandle);
  resetHandle=setTimeout(()=>{
    if (firstName.value || lastName.value || photoDataUrl || lang!=='en') resetKiosk();
  },RESET_TIME_MS);
}
['click','touchstart','keydown','input'].forEach(name=>
  document.addEventListener(name,resetInactivityTimer,{passive:true}));
setLanguage('en');
startCamera();
resetInactivityTimer();

// Optional printer-only diagnostic without creating a Sheet/Drive visitor entry.
// Open the kiosk page with ?printtest=1 and click the test button.
if (new URLSearchParams(location.search).get('printtest')==='1') {
  const test=document.createElement('button');
  test.type='button'; test.textContent='Print 29 × 90.3 mm test label';
  test.style.cssText='display:block;margin:14px auto;background:#555;color:white';
  document.querySelector('.card').appendChild(test);
  test.addEventListener('click',async()=>{
    test.disabled=true;
    const testHtml=`<!doctype html><html><head><style>
      @page{size:90.3mm 29mm;margin:0}html,body{margin:0;width:90.3mm;height:29mm;overflow:hidden}
      body{font:700 15pt Arial;box-sizing:border-box;padding:4mm}
      small{display:block;font:9pt Arial;margin-top:2mm}
      </style></head><body>VISITOR PRINT TEST<small>DK-1201 · 90.3 × 29 mm</small></body></html>`;
    try {
      show('Sending test label...','loading');
      // Same printing procedure; no visitor is submitted.
      const f=document.createElement('iframe'); f.id='printFrame'; document.body.appendChild(f);
      f.contentDocument.open(); f.contentDocument.write(testHtml); f.contentDocument.close();
      await new Promise(resolve=>setTimeout(resolve,400));
      f.contentWindow.focus(); f.contentWindow.print();
      await new Promise(resolve=>setTimeout(resolve,3000));
      f.remove(); show('Test print command sent. Check the printer.','success');
    } catch(err) { console.error(err); show('Test print failed.','error'); }
    test.disabled=false;
  });
}
</script>
</body>
</html>
